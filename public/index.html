<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WasHere</title>
<script>try{var t=JSON.parse(localStorage.getItem("wh_theme"));if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0c2f5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WasHere">
<link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap">
<style>
:root{--bg:#f3f1ec;--card:#fff;--ink:#1c2321;--mute:#66706c;--line:#dedbd3;--brand:#d9482f;--brand2:#b93a24;--warn:#b45309;--danger:#b91c1c;--onb:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#121816;--card:#1b2320;--ink:#eef2f0;--mute:#9aa6a1;--line:#2c3733;--brand:#ff8a70;--brand2:#ff6f50;--warn:#fbbf24;--danger:#f87171;--onb:#2a0e08}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:'IBM Plex Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
main{flex:1;overflow:hidden;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;padding:16px;display:none}
.view.on{display:block}
#v-map{padding:0}
#map{position:absolute;inset:0}
nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:12px 0 10px;border:0;background:none;color:var(--mute);font:600 13px inherit;font-family:inherit}
nav button.on{color:var(--brand)}
nav svg{display:block;margin:0 auto 3px;width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:22px;margin:4px 0 2px}
.sub{color:var(--mute);font-size:14px;margin:0}
.hero{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100% - 70px);gap:22px;text-align:center}
#go{width:min(68vw,270px);aspect-ratio:1;border-radius:50%;border:0;background:var(--brand);color:var(--onb);font:700 24px inherit;font-family:inherit;box-shadow:0 0 0 12px color-mix(in srgb,var(--brand) 18%,transparent),0 0 0 26px color-mix(in srgb,var(--brand) 8%,transparent);transition:transform .12s}
#go:active{transform:scale(.95)}
#go[disabled]{opacity:.7}
#go svg{width:54px;height:54px;display:block;margin:0 auto 6px;fill:none;stroke:var(--onb);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.last{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;width:100%;max-width:360px;text-align:left}
.banner{background:color-mix(in srgb,var(--warn) 16%,var(--card));border:1px solid var(--warn);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px;display:none}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;color:#fff;font-weight:600}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
.bar select,.bar input{font:14px inherit;font-family:inherit;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);flex:1;min-width:110px}
.item{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c,#999);border-radius:10px;padding:12px;margin-bottom:10px}
.item .t{font-size:13px;color:var(--mute)}
.item .a{font-weight:600;margin:3px 0}
.item .c{font:13px ui-monospace,Menlo,monospace;color:var(--mute)}
.item img{width:100%;max-height:180px;object-fit:cover;border-radius:8px;margin-top:8px;cursor:zoom-in}
.acts{display:flex;gap:8px;margin-top:10px}
.btn{font:600 14px inherit;font-family:inherit;border:1px solid var(--line);background:none;color:var(--ink);padding:8px 12px;border-radius:9px}
.btn.p{background:var(--brand);border-color:var(--brand);color:var(--onb)}
.btn.d{color:var(--danger)}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
#loc{position:absolute;right:12px;bottom:16px;z-index:500;width:48px;height:48px;border-radius:50%;border:0;background:var(--card);box-shadow:0 2px 8px #0004;color:var(--brand)}
#loc svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:2000;max-width:90vw;display:flex;gap:12px;align-items:center}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{background:none;border:0;color:var(--brand);font:700 14px inherit;font-family:inherit}
dialog{border:0;border-radius:16px;padding:18px;width:min(92vw,420px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:#0008}
dialog label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
dialog textarea,dialog select{width:100%;font:15px inherit;font-family:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.leaflet-container{font-family:inherit;background:var(--bg)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--card);color:var(--ink)}
.leaflet-popup-content a{color:var(--brand)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}
.card h2{font-size:15px;margin:0 0 12px}
.themes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.th{border:0;background:none;color:var(--ink);font:600 12px inherit;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:4px;padding:0}
.th i{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-style:normal;border:3px solid transparent;box-shadow:0 0 0 1px var(--line)}
.th.on i{border-color:var(--brand)}
.th small{color:var(--mute);font-weight:400;font-size:11px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:5px 6px 5px 10px;font-size:14px}
.chip i{width:12px;height:12px;border-radius:50%}
.chip button{border:0;background:none;color:var(--mute);font-size:18px;line-height:1;padding:0 6px}
#v-set select{width:100%;font:15px inherit;font-family:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
#viewer{position:fixed;inset:0;background:#000e;z-index:3000;display:none;overflow:auto;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#viewer.on{display:flex}
#viewer img{margin:auto;max-width:100%;max-height:100%;object-fit:contain;cursor:zoom-in}
#viewer.z img{max-width:none;max-height:none;width:240vw;cursor:zoom-out}
#vx{position:fixed;top:calc(12px + env(safe-area-inset-top));right:14px;width:44px;height:44px;border-radius:50%;border:0;background:#000a;color:#fff;font-size:20px;z-index:3001}
html[data-theme=ocean]{--bg:#eaf2fb;--card:#fff;--ink:#0f2238;--mute:#587089;--line:#cfdcec;--brand:#1769d1;--brand2:#0f55ad;--onb:#fff;--warn:#a15c07;--danger:#b91c1c;color-scheme:light}
html[data-theme=forest]{--bg:#edf3ea;--card:#fff;--ink:#16291b;--mute:#566a5b;--line:#d2dfcd;--brand:#2b7a3d;--brand2:#1f5c2d;--onb:#fff;--warn:#a15c07;--danger:#b91c1c;color-scheme:light}
html[data-theme=midnight]{--bg:#0a1020;--card:#121a2f;--ink:#e8eefc;--mute:#8d9bb8;--line:#243252;--brand:#6aa8ff;--brand2:#4d8fe8;--onb:#07101f;--warn:#fbbf24;--danger:#f87171;color-scheme:dark}
html[data-theme=amoled]{--bg:#000;--card:#101010;--ink:#f4f4f4;--mute:#9a9a9a;--line:#262626;--brand:#ffa94d;--brand2:#f08c00;--onb:#1a0f00;--warn:#fbbf24;--danger:#f87171;color-scheme:dark}
</style>
</head>
<body>
<main>
  <section class="view on" id="v-home">
    <div class="banner" id="gpsBanner"></div>
    <div class="hero">
      <div><h1>WasHere</h1><p class="sub" id="status">แตะปุ่มเพื่อบันทึกตำแหน่งปัจจุบัน</p></div>
      <button id="go" aria-label="บันทึกตำแหน่ง"><svg viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>บันทึกตำแหน่ง</button>
      <div class="last" id="last" style="display:none"></div>
    </div>
  </section>
  <section class="view" id="v-hist">
    <h1>ประวัติ</h1>
    <div class="bar">
      <input id="q" type="search" placeholder="ค้นหาโน้ตหรือสถานที่">
      <select id="fd"><option value="all">ทุกวัน</option><option value="today">วันนี้</option><option value="week">7 วันล่าสุด</option></select>
      <select id="ft"></select>
    </div>
    <div id="list"></div>
    <div class="bar"><button class="btn" data-x="csv">CSV</button><button class="btn" data-x="kml">KML</button><button class="btn" data-x="gpx">GPX</button></div>
  </section>
  <section class="view" id="v-map"><div id="map"></div>
    <button id="loc" aria-label="ไปตำแหน่งปัจจุบัน"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
  </section>
  <section class="view" id="v-set">
    <h1>ตั้งค่า</h1>
    <div class="card"><h2>ธีมสี</h2><div class="themes" id="themes"></div></div>
    <div class="card"><h2>หมวดหมู่</h2><div class="chips" id="tagList"></div>
      <div class="bar"><input id="tn" placeholder="ชื่อหมวดหมู่ใหม่" maxlength="20" aria-label="ชื่อหมวดหมู่ใหม่"><input id="tc" type="color" value="#0891b2" aria-label="สีหมวดหมู่" style="flex:0 0 52px;min-width:0;padding:2px"><button class="btn p" id="ta">เพิ่ม</button></div></div>
    <div class="card"><h2>รูปแบบแผนที่</h2><select id="tl" aria-label="รูปแบบแผนที่"></select>
      <p class="sub" style="margin-top:8px">เปลี่ยนแล้วมีผลทันทีในแท็บแผนที่</p></div>
  </section>
</main>
<nav>
  <button data-v="home" class="on"><svg viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>บันทึก</button>
  <button data-v="hist"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>ประวัติ</button>
  <button data-v="map"><svg viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg>แผนที่</button>
  <button data-v="set"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>ตั้งค่า</button>
</nav>
<div id="viewer"><button id="vx" aria-label="ปิด">✕</button><img alt="รูปถ่ายเต็มหน้าจอ"></div>
<div id="toast"><span id="tmsg"></span><button id="tact" hidden></button></div>

<dialog id="dlg"><form method="dialog" id="ef">
  <h1 style="font-size:18px">แก้ไขรายการ</h1>
  <label for="en">โน้ต</label><textarea id="en" rows="3" placeholder="เช่น จอดรถชั้น 3"></textarea>
  <label for="et">หมวดหมู่</label><select id="et"></select>
  <label for="ep">รูปถ่าย</label><input id="ep" type="file" accept="image/*" capture="environment">
  <label id="rmw" style="display:none"><input type="checkbox" id="rm"> ลบรูปเดิมของรายการนี้</label>
  <div class="acts" style="justify-content:flex-end;margin-top:16px"><button class="btn" value="cancel">ยกเลิก</button><button class="btn p" id="esave" value="ok">บันทึก</button></div>
</form></dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ===== Config ===== */
// ใส่ URL ของ Backend (Supabase Edge Function / Firebase Function) เพื่อซิงค์ขึ้น Cloud เมื่อออนไลน์
const SYNC_URL = '';
const DEF_TAGS={work:['งาน','#2563eb'],travel:['ท่องเที่ยว','#16a34a'],food:['ร้านอาหาร','#ea580c'],other:['อื่นๆ','#7c3aed']};
const store={get:(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let TAGS=(()=>{const t=store.get('wh_tags',null);if(!t||typeof t!=='object'||!t.other)return DEF_TAGS;
  const o={};for(const[k,v]of Object.entries(t))if(/^[a-z0-9]+$/i.test(k)&&Array.isArray(v))o[k]=[String(v[0]).slice(0,20),/^#[0-9a-f]{6}$/i.test(v[1])?v[1]:'#888888'];return o.other?o:DEF_TAGS})();
const tg=k=>TAGS[k]||['ไม่ระบุ','#888888'];

/* ===== Helpers ===== */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=t=>new Date(t).toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'});
let tt; function toast(msg,act,fn){$('#tmsg').textContent=msg;const b=$('#tact');b.hidden=!act;if(act){b.textContent=act;b.onclick=()=>{fn();$('#toast').classList.remove('on')}}
  $('#toast').classList.add('on');clearTimeout(tt);tt=setTimeout(()=>$('#toast').classList.remove('on'),act?5000:2500)}

/* ===== IndexedDB (offline-first) ===== */
let db;
const openDB=()=>new Promise((ok,no)=>{const r=indexedDB.open("washere",1);r.onupgradeneeded=()=>r.result.createObjectStore('p',{keyPath:'id'});r.onsuccess=()=>{db=r.result;ok()};r.onerror=()=>no(r.error)});
const tx=(m,f)=>new Promise((ok,no)=>{const t=db.transaction('p',m),o=f(t.objectStore('p'));t.oncomplete=()=>ok(o.result);t.onerror=()=>no(t.error)});
const getAll=async()=>(await tx('readonly',s=>s.getAll())).sort((a,b)=>b.ts-a.ts);
const put=r=>tx('readwrite',s=>s.put(r)), del=id=>tx('readwrite',s=>s.delete(id));

/* ===== Geolocation ===== */
const getPos=()=>new Promise((ok,no)=>{
  if(!navigator.geolocation)return no({code:0});
  navigator.geolocation.getCurrentPosition(ok,no,{enableHighAccuracy:true,timeout:15000,maximumAge:0})});
function gpsError(e){
  const m={0:'อุปกรณ์นี้ไม่รองรับ GPS',1:'ไม่ได้รับอนุญาตเข้าถึงตำแหน่ง — เปิดสิทธิ์ Location ในการตั้งค่าเบราว์เซอร์/แอปแล้วลองอีกครั้ง',
    2:'หาตำแหน่งไม่ได้ — ตรวจสอบว่าเปิด GPS (บริการตำแหน่ง) อยู่',3:'GPS ใช้เวลานานเกินไป — ลองออกไปที่โล่งแล้วกดใหม่'};
  const b=$('#gpsBanner');b.textContent=m[e.code]||'เกิดข้อผิดพลาดในการอ่านตำแหน่ง';b.style.display='block'}

async function checkin(){
  const btn=$('#go');btn.disabled=true;$('#status').textContent='กำลังค้นหาสัญญาณ GPS…';
  try{
    const p=await getPos();$('#gpsBanner').style.display='none';
    const r={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),ts:p.timestamp||Date.now(),lat:p.coords.latitude,lng:p.coords.longitude,
      acc:Math.round(p.coords.accuracy),note:'',tag:'other',photo:'',addr:'',synced:false};
    await put(r);
    if(navigator.vibrate)navigator.vibrate(40);
    toast('บันทึกตำแหน่งเรียบร้อยแล้ว','เพิ่มโน้ต',()=>edit(r.id));
    showLast(r);render();geocode(r);sync();
    $('#status').textContent='แตะอีกครั้งเพื่อบันทึกจุดใหม่';
  }catch(e){gpsError(e);$('#status').textContent='บันทึกไม่สำเร็จ'}
  btn.disabled=false}
function showLast(r){const l=$('#last');l.style.display='block';
  l.innerHTML=`<b>บันทึกล่าสุด</b><br>${fmt(r.ts)}<br><span style="font-family:ui-monospace,monospace">${r.lat.toFixed(6)}, ${r.lng.toFixed(6)}</span> (±${r.acc} ม.)`}

/* ===== Reverse geocoding (Nominatim / OSM) ===== */
async function geocode(r){
  if(!navigator.onLine||r.addr)return;
  try{const j=await(await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&accept-language=th&lat=${r.lat}&lon=${r.lng}`)).json();
    r.addr=j.display_name||'';if(r.addr){await put(r);render();}}catch(e){}}
async function geocodePending(){for(const r of await getAll()){if(!r.addr){await geocode(r);await new Promise(s=>setTimeout(s,1100))}}}

/* ===== Cloud sync hook ===== */
async function sync(){
  if(!SYNC_URL||!navigator.onLine)return;
  const pend=(await getAll()).filter(r=>!r.synced);if(!pend.length)return;
  try{const res=await fetch(SYNC_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(pend)});
    if(res.ok)for(const r of pend){r.synced=true;await put(r)}}catch(e){}}

/* ===== History ===== */
function filtered(all){
  const q=$('#q').value.trim().toLowerCase(),d=$('#fd').value,t=$('#ft').value,now=Date.now();
  const start=new Date();start.setHours(0,0,0,0);
  return all.filter(r=>(t==='all'||r.tag===t)&&
    (d==='all'||(d==='today'&&r.ts>=start.getTime())||(d==='week'&&r.ts>=now-7*864e5))&&
    (!q||(r.note+' '+r.addr).toLowerCase().includes(q)))}
async function render(){
  const all=await getAll(),rows=filtered(all);
  $('#list').innerHTML=rows.length?rows.map(r=>`<article class="item" style="--c:${tg(r.tag)[1]}">
    <div class="t">${fmt(r.ts)} <span class="pill" style="background:${tg(r.tag)[1]}">${tg(r.tag)[0]}</span>${r.synced?'':' · รอซิงค์'}</div>
    <div class="a">${esc(r.addr)||'ยังไม่มีชื่อสถานที่ (จะดึงอัตโนมัติเมื่อออนไลน์)'}</div>
    <div class="c">${r.lat.toFixed(6)}, ${r.lng.toFixed(6)} · ±${r.acc} ม.</div>
    ${r.note?`<div style="margin-top:6px">${esc(r.note)}</div>`:''}
    ${r.photo?`<img src="${r.photo}" alt="รูปถ่าย">`:''}
    <div class="acts"><a class="btn p" style="text-decoration:none" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${r.lat},${r.lng}">นำทาง</a>
    <button class="btn" data-e="${r.id}">แก้ไข</button><button class="btn d" data-d="${r.id}">ลบ</button></div></article>`).join('')
    :'<div class="empty">ยังไม่มีรายการ — กลับไปแท็บ “บันทึก” แล้วแตะปุ่มใหญ่ได้เลย</div>';
  if(map)drawMarkers(all)}
$('#list').onclick=async e=>{
  const I=e.target.closest('.item img');if(I)return openViewer(I.src);
  const E=e.target.closest('[data-e]'),D=e.target.closest('[data-d]');
  if(E)edit(E.dataset.e);
  if(D&&confirm('ลบรายการนี้?')){await del(D.dataset.d);render()}};
['#q','#fd','#ft'].forEach(s=>$(s).addEventListener('input',render));
function fillTags(){
  const o=Object.entries(TAGS).map(([k,v])=>`<option value="${esc(k)}">${esc(v[0])}</option>`).join('');
  const f=$('#ft'),e=$('#et'),fv=f.value,ev=e.value;
  f.innerHTML='<option value="all">ทุกหมวด</option>'+o;e.innerHTML=o;
  f.value=(fv==='all'||TAGS[fv])?fv:'all';if(TAGS[ev])e.value=ev}
fillTags();

/* ===== Fullscreen photo viewer ===== */
const vw=$('#viewer');
function openViewer(src){vw.querySelector('img').src=src;vw.classList.remove('z');vw.classList.add('on')}
const closeViewer=()=>vw.classList.remove('on');
vw.onclick=e=>{if(e.target.tagName==='IMG')vw.classList.toggle('z');else closeViewer()};
$('#vx').onclick=closeViewer;
addEventListener('keydown',e=>{if(e.key==='Escape')closeViewer()});

/* ===== Edit dialog ===== */
let editing=null;
async function edit(id){editing=(await getAll()).find(r=>r.id===id);if(!editing)return;
  $('#en').value=editing.note;$('#et').value=TAGS[editing.tag]?editing.tag:'other';$('#ep').value='';$('#rm').checked=false;$('#rmw').style.display=editing.photo?'block':'none';$('#dlg').showModal()}
const shrink=f=>new Promise(ok=>{const i=new Image();i.onload=()=>{const s=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement('canvas');
  c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.7))};i.src=URL.createObjectURL(f)});
$('#ef').onsubmit=async e=>{
  if(e.submitter?.value!=='ok'||!editing)return;
  editing.note=$('#en').value.trim();editing.tag=$('#et').value;editing.synced=false;
  if($('#rm').checked)editing.photo='';
  const f=$('#ep').files[0];if(f)editing.photo=await shrink(f);
  await put(editing);render();toast('แก้ไขเรียบร้อยแล้ว');sync()};

/* ===== Map (Leaflet + OpenStreetMap) ===== */
let map,layer,me,tileL;
const TILES={
 osm:{n:'OpenStreetMap (มาตรฐาน)',u:'https://tile.openstreetmap.org/{z}/{x}/{y}.png',z:19,a:'© OpenStreetMap'},
 hot:{n:'OSM ฮิวแมนิทาเรียน (ชัดเจน)',u:'https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png',z:19,a:'© OpenStreetMap, HOT'},
 light:{n:'CARTO สว่าง (มินิมอล)',u:'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',z:20,a:'© OpenStreetMap © CARTO'},
 dark:{n:'CARTO มืด (Dark)',u:'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',z:20,a:'© OpenStreetMap © CARTO'},
 topo:{n:'OpenTopoMap (ภูมิประเทศ)',u:'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',z:17,a:'© OpenStreetMap, SRTM | © OpenTopoMap'},
 sat:{n:'ดาวเทียม (Esri)',u:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',z:19,a:'Tiles © Esri'}
};
let tileKey=store.get('wh_tile','osm');if(!TILES[tileKey])tileKey='osm';
function setTile(){if(!map)return;if(tileL)tileL.remove();const t=TILES[tileKey];
  tileL=L.tileLayer(t.u,{maxZoom:t.z,subdomains:'abc',attribution:t.a,detectRetina:true}).addTo(map);tileL.bringToBack()}
function initMap(){
  if(map)return;
  map=L.map('map',{zoomControl:false}).setView([13.7563,100.5018],12);
  setTile();
  layer=L.layerGroup().addTo(map);render()}
async function drawMarkers(all){
  layer.clearLayers();const pts=[];
  all.forEach(r=>{pts.push([r.lat,r.lng]);
    L.circleMarker([r.lat,r.lng],{radius:10,color:'#fff',weight:2,fillColor:tg(r.tag)[1],fillOpacity:1}).addTo(layer)
     .bindPopup(`<b>${fmt(r.ts)}</b><br>${esc(r.note)||'<i>ไม่มีโน้ต</i>'}<br><a target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${r.lat},${r.lng}">นำทาง</a>`)});
  if(pts.length&&!map._fitted){map.fitBounds(pts,{padding:[40,40],maxZoom:16});map._fitted=1}}
$('#loc').onclick=async()=>{try{const p=await getPos(),ll=[p.coords.latitude,p.coords.longitude];
  if(me)me.remove();me=L.circle(ll,{radius:p.coords.accuracy,color:'#2563eb',fillOpacity:.15}).addTo(map);
  L.circleMarker(ll,{radius:7,color:'#fff',weight:2,fillColor:'#2563eb',fillOpacity:1}).addTo(me._map?map:map);
  map.setView(ll,17)}catch(e){gpsError(e);toast('อ่านตำแหน่งไม่ได้ — ตรวจสอบสิทธิ์และ GPS')}};

/* ===== Export ===== */
function dl(name,type,txt){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click()}
const xe=s=>esc(s);
document.addEventListener('click',async e=>{const x=e.target.dataset?.x;if(!x)return;
  const rows=filtered(await getAll());if(!rows.length)return toast('ไม่มีข้อมูลให้ส่งออก');
  if(x==='csv')dl('checkins.csv','text/csv','\ufeff'+['เวลา,lat,lng,ความแม่นยำ(ม.),หมวด,โน้ต,ที่อยู่'].concat(rows.map(r=>
    [new Date(r.ts).toISOString(),r.lat,r.lng,r.acc,tg(r.tag)[0],r.note,r.addr].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(','))).join('\n'));
  if(x==='kml')dl('checkins.kml','application/vnd.google-earth.kml+xml',`<?xml version="1.0" encoding="UTF-8"?><kml xmlns="http://www.opengis.net/kml/2.2"><Document>${rows.map(r=>
    `<Placemark><name>${xe(fmt(r.ts))}</name><description>${xe(r.note)}</description><TimeStamp><when>${new Date(r.ts).toISOString()}</when></TimeStamp><Point><coordinates>${r.lng},${r.lat},0</coordinates></Point></Placemark>`).join('')}</Document></kml>`);
  if(x==='gpx')dl('checkins.gpx','application/gpx+xml',`<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1" creator="checkin" xmlns="http://www.topografix.com/GPX/1/1">${rows.map(r=>
    `<wpt lat="${r.lat}" lon="${r.lng}"><time>${new Date(r.ts).toISOString()}</time><name>${xe(fmt(r.ts))}</name><desc>${xe(r.note)}</desc></wpt>`).join('')}</gpx>`)});

/* ===== Settings ===== */
const THEMES={
 coral:{n:'โคราล',m:'อัตโนมัติ',i:'🌗',bg:'#f3f1ec',br:'#d9482f'},
 ocean:{n:'ทะเล',m:'สว่าง',i:'🌊',bg:'#eaf2fb',br:'#1769d1'},
 forest:{n:'ป่า',m:'สว่าง',i:'🌿',bg:'#edf3ea',br:'#2b7a3d'},
 midnight:{n:'เที่ยงคืน',m:'มืด',i:'🌙',bg:'#0a1020',br:'#6aa8ff'},
 amoled:{n:'ดำสนิท',m:'มืด',i:'🌑',bg:'#000000',br:'#ffa94d'}
};
let themeKey=store.get('wh_theme','coral');if(!THEMES[themeKey])themeKey='coral';
function applyTheme(k){themeKey=k;document.documentElement.dataset.theme=k;store.set('wh_theme',k);
  $$('.th').forEach(b=>b.classList.toggle('on',b.dataset.t===k));
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=getComputedStyle(document.body).backgroundColor}
$('#themes').innerHTML=Object.entries(THEMES).map(([k,t])=>`<button class="th" data-t="${k}" aria-label="ธีม${t.n} (${t.m})"><i style="background:linear-gradient(135deg,${t.bg} 50%,${t.br} 50%)">${t.i}</i>${t.n}<small>${t.m}</small></button>`).join('');
$('#themes').onclick=e=>{const b=e.target.closest('.th');if(b)applyTheme(b.dataset.t)};
applyTheme(themeKey);

$('#tl').innerHTML=Object.entries(TILES).map(([k,t])=>`<option value="${k}">${t.n}</option>`).join('');
$('#tl').value=tileKey;
$('#tl').onchange=()=>{tileKey=$('#tl').value;store.set('wh_tile',tileKey);setTile()};

function renderTagList(){$('#tagList').innerHTML=Object.entries(TAGS).map(([k,v])=>
  `<span class="chip"><i style="background:${v[1]}"></i>${esc(v[0])}${k==='other'?'':`<button data-dt="${k}" aria-label="ลบหมวด ${esc(v[0])}">×</button>`}</span>`).join('')}
function saveTags(){store.set('wh_tags',TAGS);fillTags();renderTagList();render()}
$('#ta').onclick=()=>{
  const n=$('#tn').value.trim().slice(0,20);if(!n)return toast('กรุณาใส่ชื่อหมวดหมู่');
  if(Object.values(TAGS).some(v=>v[0].toLowerCase()===n.toLowerCase()))return toast('มีหมวดหมู่นี้แล้ว');
  TAGS['c'+Date.now().toString(36)]=[n,$('#tc').value];$('#tn').value='';saveTags();toast('เพิ่มหมวดหมู่แล้ว')};
$('#tn').onkeydown=e=>{if(e.key==='Enter')$('#ta').click()};
$('#tagList').onclick=async e=>{const b=e.target.closest('[data-dt]');if(!b)return;const k=b.dataset.dt;
  if(!confirm(`ลบหมวด “${TAGS[k][0]}” ? รายการเดิมในหมวดนี้จะย้ายไป “${TAGS.other[0]}”`))return;
  for(const r of await getAll())if(r.tag===k){r.tag='other';r.synced=false;await put(r)}
  delete TAGS[k];saveTags();toast('ลบหมวดหมู่แล้ว')};
renderTagList();

/* ===== Navigation / boot ===== */
$$('nav button').forEach(b=>b.onclick=()=>{
  $$('nav button').forEach(x=>x.classList.toggle('on',x===b));
  $$('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+b.dataset.v));
  if(b.dataset.v==='map'){initMap();setTimeout(()=>map.invalidateSize(),50)}
  if(b.dataset.v==='hist')render()});
$('#go').onclick=checkin;
addEventListener('online',()=>{sync();geocodePending()});
(async()=>{
  await openDB();const all=await getAll();if(all[0])showLast(all[0]);render();
  if(navigator.permissions)try{const s=await navigator.permissions.query({name:'geolocation'});
    const chk=()=>{if(s.state==='denied')gpsError({code:1})};chk();s.onchange=chk}catch(e){}
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  if(navigator.onLine){sync();geocodePending()}
})();
</script>
</body>
